name: Docker Image

# 本仓库自有的镜像发布路径。上游 release.yml 刻意把 latest 留在 1.x
# （release-promote-image-channels.sh 结尾会断言 latest 的 digest 保持不变），
# 这里不沿用那套频道语义：main 的最新提交就是 latest，2 与 latest 同指一处。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build version
        id: version
        shell: bash
        run: printf 'value=2.0.0-dev+%s\n' "${GITHUB_SHA:0:7}" >>"${GITHUB_OUTPUT}"

      # 只有 runtime 层的 apk add 需要在目标架构上真实执行，由 QEMU 承担；
      # web 与 Go 构建阶段固定在 BUILDPLATFORM 上交叉编译，不走模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # GHCR 仓库名必须全小写，这里写死小写而不是从 github.repository 推导。
          images: ghcr.io/desuwadev/gpt-load
          # 默认分支之外手动触发时只推 sha 标签，避免把 latest 指向试验分支。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=2,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # 源码自包含构建；prebuilt 需要 build context 里存在交叉编译好的
          # release/gpt-load-linux-<arch>，那是上游发布流程才有的产物。
          target: source-build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation，避免 GHCR 包页面出现 unknown/unknown 条目。
          provenance: false

      - name: Summarize published tags
        shell: bash
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            printf '## Published image tags\n\n'
            while IFS= read -r tag; do
              test -n "${tag}" || continue
              printf -- '- `%s`\n' "${tag}"
            done <<<"${PUBLISHED_TAGS}"
          } >>"${GITHUB_STEP_SUMMARY}"
